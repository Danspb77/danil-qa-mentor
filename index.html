<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Персональная страница Дани — менторство." />
    <title>Даня — ментор</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f7f6f2;
        color: #1c1c1a;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 10% 10%, #f6d995 0, transparent 32rem),
          radial-gradient(circle at 90% 90%, #bfe5d3 0, transparent 30rem),
          #f7f6f2;
      }

      main {
        width: min(100%, 760px);
        padding: clamp(40px, 9vw, 88px);
        border: 1px solid rgba(28, 28, 26, 0.1);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.72);
        box-shadow: 0 18px 60px rgba(62, 53, 31, 0.12);
        backdrop-filter: blur(14px);
      }

      p {
        margin: 0 0 18px;
        color: #66645d;
        font-size: 1rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 8ch;
        margin: 0;
        font-size: clamp(3rem, 10vw, 6.8rem);
        line-height: 0.98;
        letter-spacing: -0.07em;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Менторство</p>
      <h1>Привет!<br />Я Даня</h1>
    </main>
  </body>
</html>
